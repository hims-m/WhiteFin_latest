# docker compose up --build   ->  open http://localhost:8000
# (inside the container the app listens on 7860, the Hugging Face port)
services:
  whitefin:
    build: .
    ports:
      - "8000:7860"
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Locally we can keep history between restarts in a named volume.
      DATABASE_URL: "sqlite:////data/whitefin.db"
    volumes:
      - whitefin-data:/data
volumes:
  whitefin-data:
