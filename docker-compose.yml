# docker compose up --build   ->  open http://localhost:8000
services:
  whitefin:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    volumes:
      - whitefin-data:/data
volumes:
  whitefin-data:
